name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire pour que nx affected compare les commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # remplacez par pnpm si vous utilisez pnpm

      - run: npm ci

      # Calcule les commits de base/tête pour "nx affected"
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      # Ne vérifie que les projets touchés par la modification
      - run: npx nx affected -t lint test build
